<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园活动聚合 - 天津大学</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    line-height: 1.5;
  }
  .container { max-width: 800px; margin: 0 auto; padding: 16px; }

  header {
    text-align: center; padding: 24px 0 16px;
    background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 100%);
    color: #fff; margin-bottom: 16px; border-radius: 0 0 20px 20px;
  }
  header h1 { font-size: 24px; font-weight: 700; }
  header p { font-size: 13px; opacity: .85; margin-top: 4px; }

  .search-bar {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .search-bar input {
    flex: 1; padding: 10px 14px; border: 1px solid #d2d2d7; border-radius: 10px;
    font-size: 14px; outline: none; background: #fff;
  }
  .search-bar input:focus { border-color: #b71c1c; box-shadow: 0 0 0 3px rgba(183,28,28,.15); }
  .search-bar button {
    padding: 10px 18px; border: none; border-radius: 10px; background: #b71c1c;
    color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .search-bar button:hover { background: #a31515; }

  .tabs {
    display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; padding-bottom: 4px;
  }
  .tab {
    padding: 8px 16px; border-radius: 20px; border: 1px solid #d2d2d7;
    background: #fff; cursor: pointer; font-size: 13px; white-space: nowrap;
    transition: all .15s;
  }
  .tab:hover { border-color: #b71c1c; }
  .tab.active { background: #b71c1c; color: #fff; border-color: #b71c1c; }
  .tab .count { font-size: 11px; opacity: .6; margin-left: 4px; }
  .tab.active .count { opacity: .8; }

  .filter-row {
    display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center;
  }
  .filter-label { font-size: 12px; color: #86868b; margin-right: 4px; }
  .chip {
    padding: 4px 12px; border-radius: 14px; border: 1px solid #d2d2d7;
    background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
    transition: all .15s;
  }
  .chip:hover { border-color: #b71c1c; }
  .chip.active { background: #b71c1c; color: #fff; border-color: #b71c1c; }

  .stats-bar {
    font-size: 12px; color: #86868b; margin-bottom: 12px; text-align: center; line-height: 1.6;
  }

  .event-card {
    background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: box-shadow .15s;
    border-left: 4px solid #667eea;
  }
  .event-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  .event-card.lecture { border-left-color: #1976d2; }
  .event-card.event { border-left-color: #c2185b; }
  .event-card.volunteer { border-left-color: #388e3c; }
  .event-card.other { border-left-color: #a0a0a0; }

  .event-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px; margin-bottom: 6px;
  }
  .event-title {
    font-size: 15px; font-weight: 600; line-height: 1.3;
  }
  .badge-row {
    display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0; justify-content: flex-end;
  }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    white-space: nowrap;
  }
  .badge-lecture { background: #e3f2fd; color: #1565c0; }
  .badge-event { background: #fce4ec; color: #c2185b; }
  .badge-volunteer { background: #e8f5e9; color: #2e7d32; }
  .badge-other { background: #f0f0f0; color: #555; }
  .badge-campus-wj { background: #fff3e0; color: #e65100; }
  .badge-campus-by { background: #e8f5e9; color: #1b5e20; }
  .badge-campus-online { background: #e3f2fd; color: #0d47a1; }
  .badge-ticket-academic { background: #fce4ec; color: #b71c1c; }
  .badge-ticket-theme { background: #f3e5f5; color: #7b1fa2; }

  .event-meta {
    font-size: 12px; color: #666; margin-bottom: 6px;
  }
  .event-meta span { margin-right: 12px; }
  .event-desc {
    font-size: 13px; color: #444; margin-bottom: 6px;
  }
  .event-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: #86868b; padding-top: 6px; border-top: 1px solid #f0f0f0;
  }
  .event-footer a { color: #b71c1c; text-decoration: none; }
  .event-footer a:hover { text-decoration: underline; }

  .date-sep {
    font-size: 13px; font-weight: 600; color: #555;
    padding: 12px 0 6px; margin-top: 4px;
  }

  .empty-state {
    text-align: center; padding: 60px 20px; color: #86868b;
  }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }

  .loading { text-align: center; padding: 40px; color: #86868b; }

  .page-footer {
    text-align: center; padding: 20px 0 30px;
    font-size: 11px; color: #a0a0a0;
  }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    header { padding: 18px 0 12px; }
    header h1 { font-size: 20px; }
    .event-title { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <h1>📅 校园活动聚合</h1>
  <p>天津大学 · 讲座 · 活动 · 志愿招募 &mdash; 一目了然</p>
</header>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索活动、地点、组织..." oninput="filterEvents()">
    <button onclick="refreshData()">刷新</button>
  </div>

  <div class="tabs" id="tabContainer">
    <div class="tab active" data-category="all" onclick="switchTab('all', this)">全部</div>
    <div class="tab" data-category="lecture" onclick="switchTab('lecture', this)">📚 讲座</div>
    <div class="tab" data-category="event" onclick="switchTab('event', this)">🎭 活动</div>
    <div class="tab" data-category="volunteer" onclick="switchTab('volunteer', this)">🤝 志愿</div>
  </div>

  <div class="filter-row">
    <span class="filter-label">校区</span>
    <div class="chip active" data-campus="" onclick="switchCampus('', this)">全部</div>
    <div class="chip" data-campus="卫津路" onclick="switchCampus('卫津路', this)">📍卫津路</div>
    <div class="chip" data-campus="北洋园" onclick="switchCampus('北洋园', this)">📍北洋园</div>
    <div class="chip" data-campus="线上" onclick="switchCampus('线上', this)">💻线上</div>
  </div>

  <div class="filter-row">
    <span class="filter-label">讲座单</span>
    <div class="chip active" data-ticket="" onclick="switchTicket('', this)">全部</div>
    <div class="chip" data-ticket="academic" onclick="switchTicket('academic', this)">📕人文学术（必修）</div>
    <div class="chip" data-ticket="theme" onclick="switchTicket('theme', this)">📗主题教育（选修）</div>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div id="eventList"></div>
  <div class="page-footer" id="footer"></div>
</div>

<script>
const DATA_URL = './events.json';
let allEvents = [];
let currentTab = 'all';
let currentCampus = '';
let currentTicket = '';

async function loadData() {
  const list = document.getElementById('eventList');
  list.innerHTML = '<div class="loading">加载中...</div>';

  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    allEvents = data.events || [];

    const stats = data.stats || {};
    document.querySelectorAll('.tab').forEach(tab => {
      const cat = tab.dataset.category;
      const cnt = stats[cat] || 0;
      const span = tab.querySelector('.count');
      if (!span) {
        const s = document.createElement('span');
        s.className = 'count';
        s.textContent = '(' + (cat === 'all' ? (stats.total || 0) : cnt) + ')';
        tab.appendChild(s);
      } else {
        span.textContent = '(' + (cat === 'all' ? (stats.total || 0) : cnt) + ')';
      }
    });

    const updatedAt = data.updated_at || '未知';
    document.getElementById('footer').textContent =
      '数据更新于 ' + updatedAt + ' · 共 ' + allEvents.length + ' 个活动';

    filterEvents();
  } catch (e) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">😅</div><p>数据加载失败，请确认 events.json 文件存在</p><p style="font-size:12px;margin-top:8px">' + e.message + '</p></div>';
  }
}

function switchTab(category, el) {
  currentTab = category;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchCampus(campus, el) {
  currentCampus = campus;
  document.querySelectorAll('[data-campus]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchTicket(ticket, el) {
  currentTicket = ticket;
  document.querySelectorAll('[data-ticket]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function filterEvents() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const upcomingOnly = true;
  const list = document.getElementById('eventList');

  let filtered = allEvents.filter(ev => {
    if (currentTab !== 'all' && ev.category !== currentTab) return false;
    if (currentCampus && ev.campus !== currentCampus) return false;
    if (currentTicket) {
      if (ev.ticket_type !== currentTicket) return false;
    }
    if (upcomingOnly && ev.date && ev.date < getToday()) return false;
    if (search) {
      const haystack = (ev.title + ' ' + ev.location + ' ' + ev.organizer + ' ' + ev.description).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    if (a.date !== b.date) return (a.date || '').localeCompare(b.date || '');
    return (a.start_time || '').localeCompare(b.start_time || '');
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>没有匹配的活动</p></div>';
    return;
  }

  const campusCnt = {};
  const ticketCnt = {};
  filtered.forEach(ev => {
    campusCnt[ev.campus || '未知'] = (campusCnt[ev.campus || '未知'] || 0) + 1;
    if (ev.ticket_type) ticketCnt[ev.ticket_type] = (ticketCnt[ev.ticket_type] || 0) + 1;
  });
  let statsParts = ['显示 ' + filtered.length + ' / ' + allEvents.length + ' 个活动'];
  const campusParts = Object.entries(campusCnt).map(([k, v]) => {
    const labels = {'卫津路':'📍卫津路','北洋园':'📍北洋园','线上':'💻线上'};
    return (labels[k] || k) + ' ' + v;
  });
  if (campusParts.length > 0) statsParts.push('｜' + campusParts.join(' '));
  if (ticketCnt.academic) statsParts.push('｜📕人文学术 ' + ticketCnt.academic);
  if (ticketCnt.theme) statsParts.push('｜📗主题教育 ' + ticketCnt.theme);
  document.getElementById('statsBar').textContent = statsParts.join(' ');

  let html = '';
  let lastDate = '';
  for (const ev of filtered) {
    const d = ev.date || '待定';
    if (d !== lastDate) {
      html += '<div class="date-sep">' + formatDate(d) + '</div>';
      lastDate = d;
    }
    html += renderCard(ev);
  }
  list.innerHTML = html;
}

function renderCard(ev) {
  const catLabel = {lecture:'📚讲座', event:'🎭活动', volunteer:'🤝志愿', other:'📄其他'}[ev.category] || '📄其他';
  const catClass = ['lecture','event','volunteer'].includes(ev.category) ? ev.category : 'other';

  let badges = '<div class="badge-row">';
  badges += '<span class="badge badge-' + catClass + '">' + catLabel + '</span>';

  const campusMap = {'卫津路':'badge-campus-wj','北洋园':'badge-campus-by','线上':'badge-campus-online'};
  if (ev.campus && campusMap[ev.campus]) {
    badges += ' <span class="badge ' + campusMap[ev.campus] + '">📍' + ev.campus + '</span>';
  }

  if (ev.ticket_type === 'academic') {
    badges += ' <span class="badge badge-ticket-academic">📕人文学术 ✅必修</span>';
  } else if (ev.ticket_type === 'theme') {
    badges += ' <span class="badge badge-ticket-theme">📗主题教育 📌选修</span>';
  }

  if (ev.volunteer_hours) {
    badges += ' <span class="badge badge-volunteer">⏱' + ev.volunteer_hours + 'h</span>';
  }
  badges += '</div>';

  const timeStr = [ev.start_time, ev.end_time].filter(Boolean).join(' - ');
  const meta = [];
  if (ev.date) meta.push('<span>📅 ' + ev.date + '</span>');
  if (timeStr) meta.push('<span>⏰ ' + timeStr + '</span>');
  if (ev.location) meta.push('<span>📍 ' + ev.location + '</span>');

  let desc = '';
  if (ev.description) desc = '<div class="event-desc">' + escapeHtml(ev.description) + '</div>';

  let ticketNote = '';
  if (ev.ticket_info) {
    ticketNote = ' <span style="color:#e65100;font-size:11px">🎫 ' + escapeHtml(ev.ticket_info) + '</span>';
  }

  return '<div class="event-card ' + catClass + '">' +
    '<div class="event-header">' +
      '<div class="event-title">' + escapeHtml(ev.title) + '</div>' +
      badges +
    '</div>' +
    '<div class="event-meta">' + meta.join('') + '</div>' +
    desc +
    '<div class="event-footer">' +
      '<span>' + escapeHtml(ev.organizer || ev.source_name) + ticketNote + '</span>' +
      '<a href="' + escapeHtml(ev.source_url) + '" target="_blank" rel="noopener">查看原文 →</a>' +
    '</div>' +
  '</div>';
}

function formatDate(d) {
  if (!d) return '待定';
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  try {
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt.getTime())) return d;
    const month = dt.getMonth() + 1;
    const day = dt.getDate();
    const wd = weekdays[dt.getDay()];
    const today = new Date();
    const diff = Math.floor((dt - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    let prefix = '';
    if (diff === 0) prefix = '今天 · ';
    else if (diff === 1) prefix = '明天 · ';
    else if (diff === 2) prefix = '后天 · ';
    else if (diff > 0 && diff <= 7) prefix = '周' + wd + ' · ';
    return prefix + month + '月' + day + '日 周' + wd;
  } catch { return d; }
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function refreshData() {
  loadData();
}

loadData();
</script>
</body>
</html>
