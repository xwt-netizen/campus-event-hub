<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北洋校园 · 天津大学校园活动信息台</title>
<style>
  :root {
    --blue: #1a4d7e;        /* 北洋蓝 */
    --blue-deep: #123a5e;
    --blue-soft: #eaf0f6;
    --red: #9e3b3b;         /* 海棠红（点缀） */
    --red-soft: #f7edec;
    --gold: #a9853f;        /* 金（点缀） */
    --green: #3f6d4e;
    --green-soft: #eaf1ec;
    --purple: #6b5a8a;
    --purple-soft: #f0edf6;
    --bg: #f7f5f0;          /* 象牙白 */
    --card: #fff;
    --ink: #2b3440;         /* 深蓝灰 */
    --ink-2: #6b7480;       /* 次级 */
    --ink-3: #9aa3ad;       /* 弱化 */
    --line: #e4ded2;        /* 细线 */
    --line-dark: #c9c2b2;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    font-size: 14px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ============ 顶栏（品牌） ============ */
  .topbar {
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .topbar-inner {
    max-width: 760px; margin: 0 auto; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .shield {
    width: 34px; height: 38px;
    background: var(--blue);
    clip-path: polygon(50% 0%, 88% 10%, 88% 62%, 50% 100%, 12% 62%, 12% 10%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 11px; letter-spacing: 1px; font-weight: 700;
    flex-shrink: 0;
  }
  .brand-name { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 17px; font-weight: 700; letter-spacing: 2px; color: var(--ink); }
  .brand-en { font-size: 9.5px; letter-spacing: 2px; color: var(--ink-3); margin-top: 1px; }
  .top-right { text-align: right; }
  .top-right .school { font-family: "Noto Serif SC", "Songti SC", serif; font-size: 13px; color: var(--ink-2); }
  .top-right .years { font-size: 10px; color: var(--ink-3); letter-spacing: 1px; }
  .top-right .motto { font-family: "Noto Serif SC", serif; font-size: 9.5px; letter-spacing: 3px; color: var(--gold); margin-top: 2px; }

  /* ============ 主视觉 ============ */
  .hero { padding: 30px 0 22px; text-align: center; border-bottom: 1px solid var(--line); }
  .hero h2 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 26px; font-weight: 700; letter-spacing: 3px; color: var(--ink);
  }
  .hero .date { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); letter-spacing: 1px; }
  .hero .date b { color: var(--blue); font-weight: 600; }

  .search-box { margin: 16px auto 0; max-width: 560px; display: flex; }
  .search-box input {
    flex: 1; padding: 11px 16px; border: 1px solid var(--line-dark); border-right: none;
    border-radius: 2px 0 0 2px; background: var(--card); font-size: 14px; color: var(--ink); outline: none;
  }
  .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(26,77,126,.08); }
  .search-box button {
    padding: 11px 20px; border: 1px solid var(--blue); background: var(--blue); color: #fff;
    border-radius: 0 2px 2px 0; font-size: 14px; cursor: pointer; letter-spacing: 2px;
  }
  .search-box button:hover { background: var(--blue-deep); }

  /* ============ 分类导航（文字+细线） ============ */
  .nav { margin-top: 14px; display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .nav-item {
    flex-shrink: 0; padding: 10px 14px 8px; font-size: 14px; color: var(--ink-2);
    cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent;
    transition: color .15s; background: none; border-top: none; border-left: none; border-right: none;
    letter-spacing: 1px; font-family: inherit;
  }
  .nav-item:hover { color: var(--blue); }
  .nav-item.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .nav-item .count { font-size: 11px; color: var(--ink-3); margin-left: 4px; font-weight: normal; }

  /* ============ 筛选栏 ============ */
  .filter-panel {
    margin-top: 6px; padding: 12px 2px;
    border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center;
    font-size: 12.5px;
  }
  .fgroup { display: flex; align-items: center; gap: 8px; }
  .flabel { color: var(--ink-3); letter-spacing: 1px; flex-shrink: 0; }
  .fc {
    padding: 3px 10px; border: 1px solid var(--line-dark); border-radius: 2px;
    cursor: pointer; color: var(--ink-2); background: transparent; font-size: 12px;
    transition: all .12s; white-space: nowrap;
  }
  .fc:hover { border-color: var(--blue); color: var(--blue); }
  .fc.active { background: var(--blue); border-color: var(--blue); color: #fff; }
  .check-label { display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--ink-2); }
  .check-label input { accent-color: var(--blue); }

  /* ============ 讲座单模块（核心，高权重） ============ */
  .ticket-module {
    margin-top: 4px; border: 1px solid var(--line); border-left: 3px solid var(--red);
    background: #fffdf9; padding: 10px 14px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  }
  .ticket-module .t-title {
    font-family: "Noto Serif SC", serif; font-size: 13px; font-weight: 700; color: var(--red);
    letter-spacing: 1px;
  }
  .ticket-module .t-sub { font-size: 11px; color: var(--ink-3); }
  .ticket-module .fc.active { background: var(--red); border-color: var(--red); }

  /* ============ 状态条（数据感） ============ */
  .status-line {
    margin-top: 12px; padding: 8px 2px;
    font-size: 11.5px; color: var(--ink-3); letter-spacing: .5px;
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
  }
  .status-line b { color: var(--ink-2); font-weight: 600; }

  .banner {
    margin-top: 12px; padding: 8px 12px; font-size: 12px; color: #7a6a3a;
    border: 1px solid #e3d3a8; background: #fbf7ea; border-radius: 2px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .banner a { color: var(--red); text-decoration: none; font-weight: 600; white-space: nowrap; }

  /* ============ 活动列表（日程时间线） ============ */
  .list { margin-top: 20px; }

  .day-head {
    padding: 14px 2px 8px; cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .day-head:hover .day-label { color: var(--blue); }
  .day-label { font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 700; color: var(--ink); letter-spacing: 1px; }
  .day-label.today { color: var(--blue); }
  .day-sub { font-size: 11px; color: var(--ink-3); }
  .day-count { font-size: 11px; color: var(--ink-3); }
  .fold-arrow { color: var(--ink-3); font-size: 12px; width: 14px; }

  .day-group { padding: 4px 0 8px; }

  .ev-item {
    display: flex; gap: 0; padding: 11px 2px 11px 0;
    border-bottom: 1px dashed var(--line);
    cursor: pointer; transition: background .12s;
  }
  .ev-item:hover { background: #fbfaf6; }
  .ev-item:last-child { border-bottom: none; }

  .ev-time {
    flex-shrink: 0; width: 64px; text-align: right; padding-right: 14px;
    font-family: "Noto Serif SC", serif; font-size: 16px; font-weight: 700; color: var(--ink);
    border-right: 1px solid var(--line); position: relative;
  }
  .ev-time::after {
    content: ""; position: absolute; right: -4px; top: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--line-dark);
  }
  .ev-time.no-time { font-size: 12px; font-weight: 400; color: var(--ink-3); line-height: 2.2; }

  .ev-main { flex: 1; padding-left: 16px; min-width: 0; }
  .ev-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev-type { font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
  .ev-type .sym { font-size: 10px; }
  .ev-type.lecture .sym { color: var(--blue); }
  .ev-type.event .sym { color: var(--red); }
  .ev-type.volunteer .sym { color: var(--green); }
  .ev-type.movie .sym { color: var(--purple); }
  .ev-type.notice .sym { color: var(--gold); }
  .ev-ticket {
    font-size: 11px; color: var(--red); border: 1px solid var(--red);
    border-radius: 2px; padding: 0 6px; letter-spacing: .5px; white-space: nowrap;
  }
  .ev-volh { font-size: 11px; color: var(--green); border: 1px solid #9cbfa9; border-radius: 2px; padding: 0 6px; white-space: nowrap; }

  .ev-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-top: 2px; line-height: 1.4; }
  .ev-loc { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  /* 待定组 */
  .pending-head { color: var(--ink-3); border-top: 1px dashed var(--line-dark); }
  .pending-head .day-label { color: var(--ink-3); font-weight: 400; font-size: 13px; }

  /* ============ 详情（档案卡模态） ============ */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(20,30,40,.42);
    display: none; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-mask.open { display: flex; }
  .modal {
    background: var(--bg); width: 100%; max-width: 520px;
    border-radius: 6px 6px 0 0; max-height: 86vh; overflow-y: auto;
    box-shadow: 0 -6px 30px rgba(20,30,40,.15);
  }
  .modal-head {
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .modal-close {
    background: none; border: none; font-size: 20px; color: var(--ink-3); cursor: pointer; padding: 4px;
  }
  .modal-body { padding: 20px 22px 24px; }

  .arc-cat { font-size: 12px; letter-spacing: 2px; color: var(--ink-2); }
  .arc-cat span { color: var(--blue); font-weight: 600; }
  .arc-title {
    font-family: "Noto Serif SC", serif; font-size: 22px; font-weight: 700;
    color: var(--ink); line-height: 1.4; margin: 8px 0 16px;
  }
  .arc-date-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .arc-big-date { display: flex; align-items: baseline; gap: 3px; }
  .arc-big-date .d { font-family: "Noto Serif SC", serif; font-size: 44px; font-weight: 700; color: var(--blue); line-height: 1; }
  .arc-big-date .m { font-size: 15px; color: var(--ink-2); font-family: "Noto Serif SC", serif; }
  .arc-big-date .y { font-size: 11px; color: var(--ink-3); }
  .arc-meta { font-size: 13px; color: var(--ink); line-height: 1.8; }
  .arc-meta .lbl { color: var(--ink-3); margin-right: 8px; letter-spacing: 1px; font-size: 11.5px; }

  .arc-sep { height: 1px; background: var(--line); margin: 18px 0; }
  .arc-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 13px; }
  .arc-grid .lbl { color: var(--ink-3); font-size: 11.5px; letter-spacing: 1px; padding-top: 1px; }
  .arc-grid .val { color: var(--ink); }
  .arc-ticket { color: var(--red); font-weight: 600; }
  .arc-desc { font-size: 13px; color: var(--ink-2); line-height: 1.8; margin-top: 14px; }

  .arc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .arc-foot a { color: var(--blue); text-decoration: none; font-size: 13px; }
  .arc-foot a:hover { text-decoration: underline; }
  .arc-sources { max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arc-sources a { color: var(--ink-3); text-decoration: none; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--ink-3); }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-3); }

  /* ============ 页脚 ============ */
  .foot {
    margin-top: 30px; padding: 22px 0 34px; text-align: center;
    border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); letter-spacing: 1px;
  }
  .foot .seal { font-family: "Noto Serif SC", serif; color: var(--red); letter-spacing: 3px; }
  .foot .yr { font-family: "Noto Serif SC", serif; color: var(--ink-3); letter-spacing: 2px; margin-top: 4px; }

  /* ============ 响应式 ============ */
  @media (max-width: 520px) {
    .hero h2 { font-size: 21px; }
    .brand-name { font-size: 15px; }
    .ev-time { width: 52px; font-size: 14px; }
    .ev-title { font-size: 14px; }
    .arc-title { font-size: 19px; }
    .topbar-inner { padding: 12px 14px; }
  }
</style>
</head>
<body>

<!-- 顶栏品牌 -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="shield">1895</div>
      <div>
        <div class="brand-name">北洋校园</div>
        <div class="brand-en">CAMPUS EVENT HUB</div>
      </div>
    </div>
    <div class="top-right">
      <div class="school">天津大学</div>
      <div class="years">1895 — 2026</div>
      <div class="motto">实事求是</div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- 主视觉 -->
  <div class="hero">
    <h2>今天，天大有什么？</h2>
    <div class="date" id="todayDate"></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索讲座、活动、志愿、地点、主办方…" oninput="filterEvents()">
      <button onclick="refreshData()">搜索</button>
    </div>
  </div>

  <!-- 分类导航 -->
  <div class="nav" id="tabContainer">
    <button class="nav-item active" data-category="all" onclick="switchTab('all', this)">全部</button>
    <button class="nav-item" data-category="lecture" onclick="switchTab('lecture', this)">讲座</button>
    <button class="nav-item" data-category="event" onclick="switchTab('event', this)">活动</button>
    <button class="nav-item" data-category="volunteer" onclick="switchTab('volunteer', this)">志愿</button>
    <button class="nav-item" data-category="movie" onclick="switchTab('movie', this)">电影</button>
    <button class="nav-item" data-category="notice" onclick="switchTab('notice', this)">通知</button>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-panel">
    <div class="fgroup">
      <span class="flabel">校园</span>
      <span class="fc active" data-campus="" onclick="switchCampus('', this)">全部</span>
      <span class="fc" data-campus="卫津路" onclick="switchCampus('卫津路', this)">卫津路</span>
      <span class="fc" data-campus="北洋园" onclick="switchCampus('北洋园', this)">北洋园</span>
      <span class="fc" data-campus="线上" onclick="switchCampus('线上', this)">线上</span>
    </div>
    <div class="fgroup">
      <label class="check-label"><input type="checkbox" id="upcomingFilter" onchange="filterEvents()"> 只看近期</label>
    </div>
  </div>

  <!-- 讲座单模块（核心） -->
  <div class="ticket-module">
    <div>
      <span class="t-title">讲座单</span>
      <span class="t-sub">毕业要求相关讲座</span>
    </div>
    <span class="fc active" data-ticket="" onclick="switchTicket('', this)">全部</span>
    <span class="fc" data-ticket="academic" onclick="switchTicket('academic', this)">✓ 人文学术 · 必修</span>
    <span class="fc" data-ticket="theme" onclick="switchTicket('theme', this)">主题教育 · 选修</span>
  </div>

  <!-- 状态条 -->
  <div class="status-line" id="statusLine"></div>

  <!-- 补充提示 -->
  <div class="banner" id="banner" style="display:none">
    <span id="bannerText">当前收录的公众号可能不完整</span>
    <a href="https://github.com/xwt-netizen/campus-event-hub/issues/new" target="_blank" rel="noopener">补充公众号 →</a>
  </div>

  <!-- 活动时间线 -->
  <div class="list" id="eventList"></div>

</div>

<!-- 详情档案卡模态 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeDetail()">
  <div class="modal" id="modalBox"></div>
</div>

<div class="foot">
  <div class="seal">实事求是</div>
  <div>天津大学 · 校园活动信息台</div>
  <div class="yr" id="footer">北洋 · 一八九五</div>
</div>

<script>
const DATA_URL = './events.json';
let allEvents = [];
let currentTab = 'all';
let currentCampus = '';
let currentTicket = '';
const collapsedDates = new Set(['__待定__']);

/* 今天日期 */
(function () {
  const d = new Date();
  const wd = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('todayDate').innerHTML =
    d.getFullYear() + ' 年 ' + (d.getMonth()+1) + ' 月 ' + d.getDate() + ' 日 · 星期' + wd;
})();

async function loadData() {
  const list = document.getElementById('eventList');
  list.innerHTML = '<div class="loading">正在载入…</div>';

  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    allEvents = data.events || [];

    const stats = data.stats || {};
    document.querySelectorAll('.nav-item').forEach(tab => {
      const cat = tab.dataset.category;
      const cnt = cat === 'all' ? (stats.total || 0) : (stats[cat] || 0);
      let span = tab.querySelector('.count');
      if (!span) { span = document.createElement('span'); span.className = 'count'; tab.appendChild(span); }
      span.textContent = '(' + cnt + ')';
    });

    // 状态条（数据感）
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    const parts = [];
    parts.push('已收录 <b>' + (stats.total||0) + '</b> 项校园活动');
    if (stats.lecture) parts.push('讲座 <b>' + stats.lecture + '</b>');
    if (stats.event) parts.push('活动 <b>' + stats.event + '</b>');
    if (stats.volunteer) parts.push('志愿 <b>' + stats.volunteer + '</b>');
    document.getElementById('statusLine').innerHTML =
      '<span>' + parts.join(' · ') + '</span><span>最近更新 ' + hhmm + '</span>';

    document.getElementById('footer').textContent = '北洋 · 一八九五 · 数据更新于 ' + (data.updated_at || '');

    const accountCount = stats.account_count || 0;
    const banner = document.getElementById('banner');
    if (accountCount > 0) {
      banner.style.display = 'flex';
      document.getElementById('bannerText').textContent = '已收录 ' + accountCount + ' 个公众号，可能不完整，欢迎补充';
    }

    filterEvents();
  } catch (e) {
    list.innerHTML = '<div class="empty-state"><p>数据加载失败，请确认 events.json 文件存在</p><p style="font-size:12px;margin-top:8px">' + e.message + '</p></div>';
  }
}

function switchTab(category, el) {
  currentTab = category;
  document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchCampus(campus, el) {
  currentCampus = campus;
  document.querySelectorAll('[data-campus]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchTicket(ticket, el) {
  currentTicket = ticket;
  document.querySelectorAll('[data-ticket]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function filterEvents() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const upcomingOnly = document.getElementById('upcomingFilter').checked;
  const list = document.getElementById('eventList');

  let filtered = allEvents.filter(ev => {
    if (currentTab !== 'all' && ev.category !== currentTab) return false;
    if (currentCampus && ev.campus !== currentCampus) return false;
    if (currentTicket && ev.ticket_type !== currentTicket) return false;
    if (upcomingOnly && ev.date && ev.date < getToday()) return false;
    if (search) {
      const haystack = (ev.title + ' ' + ev.location + ' ' + ev.organizer + ' ' + ev.description).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const da = a.date || '9999-99-99';
    const db = b.date || '9999-99-99';
    if (da !== db) return db.localeCompare(da);
    return (b.start_time || '').localeCompare(a.start_time || '');
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><p>没有匹配的内容</p></div>';
    return;
  }

  const dated = filtered.filter(ev => ev.date);
  const noDate = filtered.filter(ev => !ev.date);

  let html = '';

  /* 待定：放最上面 */
  if (noDate.length > 0) {
    const collapsed = collapsedDates.has('__待定__');
    html += '<div class="day-head pending-head" onclick="toggleDate(\'__待定__\', this)">' +
      '<span class="fold-arrow">' + (collapsed ? '▸' : '▾') + '</span>' +
      '<span class="day-label">待定</span><span class="day-sub">未标注具体时间</span>' +
      '<span class="day-count">' + noDate.length + '</span></div>';
    html += '<div class="day-group" id="g_pending" style="' + (collapsed ? 'display:none' : '') + '">';
    for (const ev of noDate) html += renderItem(ev);
    html += '</div>';
  }

  /* 有日期：按日分组 */
  let lastDate = '';
  for (const ev of dated) {
    const d = ev.date;
    if (d !== lastDate) {
      if (lastDate !== '') html += '</div>';
      const groupId = 'g' + d.replace(/[^0-9]/g, '');
      const collapsed = collapsedDates.has(d);
      const isToday = (d === getToday());
      html += '<div class="day-head" onclick="toggleDate(\'' + d + '\', this)">' +
        '<span class="fold-arrow">' + (collapsed ? '▸' : '▾') + '</span>' +
        '<span class="day-label' + (isToday ? ' today' : '') + '">' + formatDay(d) + '</span>' +
        (isToday ? '<span class="day-sub">今天</span>' : '') +
        '<span class="day-count">' + groupCount(dated, d) + '</span></div>';
      html += '<div class="day-group" id="' + groupId + '" style="' + (collapsed ? 'display:none' : '') + '">';
      lastDate = d;
    }
    html += renderItem(ev);
  }
  if (lastDate !== '') html += '</div>';

  list.innerHTML = html;
}

function groupCount(events, date) { return events.filter(e => e.date === date).length; }

function toggleDate(date, el) {
  if (collapsedDates.has(date)) collapsedDates.delete(date);
  else collapsedDates.add(date);
  const groupId = (date === '__待定__') ? 'g_pending' : ('g' + date.replace(/[^0-9]/g, ''));
  const group = document.getElementById(groupId);
  if (group) group.style.display = (group.style.display === 'none') ? '' : 'none';
  const arrow = el.querySelector('.fold-arrow');
  if (arrow) arrow.textContent = (collapsedDates.has(date)) ? '▸' : '▾';
}

/* 类型符号 */
function typeSym(cat) {
  const m = {lecture:'◆', event:'●', volunteer:'▲', movie:'◇', notice:'▪'};
  return m[cat] || '·';
}
function typeLabel(cat) {
  const m = {lecture:'讲座', event:'活动', volunteer:'志愿', movie:'电影', notice:'通知'};
  return m[cat] || '其他';
}

/* 时间线条目（点击开详情） */
function renderItem(ev) {
  const cat = ['lecture','event','volunteer','movie','notice'].includes(ev.category) ? ev.category : 'other';
  const timeStr = [ev.start_time, ev.end_time].filter(Boolean).join('–');
  const timeHtml = timeStr
    ? '<div class="ev-time">' + escapeHtml(timeStr) + '</div>'
    : '<div class="ev-time no-time">—</div>';

  let extra = '';
  if (ev.ticket_type === 'academic') extra += '<span class="ev-ticket">✓ 人文学术 · 必修</span>';
  else if (ev.ticket_type === 'theme') extra += '<span class="ev-ticket">主题教育 · 选修</span>';
  if (ev.volunteer_hours) extra += '<span class="ev-volh">' + ev.volunteer_hours + 'h</span>';

  const loc = [ev.location, ev.campus].filter(Boolean).join(' · ');

  const key = (ev.id !== undefined && ev.id !== null) ? ev.id : (ev.title + '|' + (ev.source_url || ''));
  evRegistry[key] = ev;

  return '<div class="ev-item" onclick="showDetail(\'' + key.replace(/'/g, "\\'") + '\')">' +
    timeHtml +
    '<div class="ev-main">' +
      '<div class="ev-top">' +
        '<span class="ev-type ' + cat + '"><span class="sym">' + typeSym(ev.category) + '</span> ' + typeLabel(ev.category) + '</span>' +
        extra +
      '</div>' +
      '<div class="ev-title">' + escapeHtml(ev.title) + '</div>' +
      (loc ? '<div class="ev-loc">' + escapeHtml(loc) + '</div>' : '') +
    '</div>' +
  '</div>';
}

const evRegistry = {};

/* 详情档案卡 */
function showDetail(key) {
  const ev = evRegistry[key];
  if (!ev) return;
  const mask = document.getElementById('modalMask');
  const box = document.getElementById('modalBox');
  const cat = ['lecture','event','volunteer','movie','notice'].includes(ev.category) ? ev.category : 'other';

  let dateBlock = '<span class="lbl">日期</span><span class="val">' + escapeHtml(ev.date || '待定') + '</span>';
  let timeBlock = '<span class="lbl">时间</span><span class="val">' + escapeHtml([ev.start_time,ev.end_time].filter(Boolean).join(' – ') || '—') + '</span>';
  let locBlock = '<span class="lbl">地点</span><span class="val">' + escapeHtml(ev.location || '—') + (ev.campus ? ' · ' + escapeHtml(ev.campus) : '') + '</span>';
  let orgBlock = '<span class="lbl">主办</span><span class="val">' + escapeHtml(ev.organizer || ev.source_name || '—') + '</span>';
  let ticketBlock = '<span class="lbl">讲座单</span><span class="val arc-ticket">' +
    (ev.ticket_type === 'academic' ? '✓ 人文学术 · 必修' : ev.ticket_type === 'theme' ? '主题教育 · 选修' : '—') + '</span>';

  const sources = ev.sources && ev.sources.length > 1
    ? ev.sources.map(s => s.url && s.url.startsWith('http') ? '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>' : escapeHtml(s.name)).join('、')
    : '';

  const linkHtml = (ev.source_url && ev.source_url.startsWith('http'))
    ? '<a href="' + escapeHtml(ev.source_url) + '" target="_blank" rel="noopener">查看原文 →</a>'
    : '<span>来源：' + escapeHtml(ev.source_name || '') + '</span>';

  box.innerHTML =
    '<div class="modal-head"><span class="arc-cat">' + typeLabel(ev.category) + ' · <span>' + typeSym(ev.category) + '</span> ' + escapeHtml(cat) + '</span>' +
    '<button class="modal-close" onclick="closeDetail()">×</button></div>' +
    '<div class="modal-body">' +
      '<div class="arc-title">' + escapeHtml(ev.title) + '</div>' +
      '<div class="arc-grid">' + dateBlock + timeBlock + locBlock + orgBlock + ticketBlock + '</div>' +
      (ev.description ? '<div class="arc-sep"></div><div class="arc-desc">' + escapeHtml(ev.description) + '</div>' : '') +
      (ev.ticket_info ? '<div class="arc-desc" style="color:#8a6d26">讲座单说明：' + escapeHtml(ev.ticket_info) + '</div>' : '') +
      (ev.recruit_deadline ? '<div class="arc-desc">报名截止：' + escapeHtml(ev.recruit_deadline) + '</div>' : '') +
      '<div class="arc-foot">' +
        '<span class="arc-sources">' + (sources ? '来源：' + sources : '') + '</span>' +
        linkHtml +
      '</div>' +
    '</div>';

  mask.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('modalMask').classList.remove('open');
  document.body.style.overflow = '';
}

function formatDay(d) {
  const m = parseInt(d.slice(5,7), 10);
  const day = parseInt(d.slice(8,10), 10);
  return m + ' 月 ' + day + ' 日';
}

function formatDate(d) {
  if (!d) return '待定';
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  try {
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt.getTime())) return d;
    const month = dt.getMonth() + 1;
    const day = dt.getDate();
    const wd = weekdays[dt.getDay()];
    const today = new Date();
    const diff = Math.floor((dt - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    let prefix = '';
    if (diff === 0) prefix = '今天 · ';
    else if (diff === 1) prefix = '明天 · ';
    else if (diff === 2) prefix = '后天 · ';
    else if (diff > 0 && diff <= 7) prefix = '周' + wd + ' · ';
    return prefix + month + '月' + day + '日 周' + wd;
  } catch { return d; }
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function refreshData() { loadData(); }

loadData();
</script>
