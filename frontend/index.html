<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天津大学 · 校园活动聚合</title>
<style>
  :root {
    --blue: #1a4d7e;        /* 北洋蓝 */
    --blue-dark: #123a5e;
    --red: #9e3b3b;         /* 海棠红 */
    --gold: #b08d3f;        /* 金 */
    --green: #3f6d4e;       /* 松绿 */
    --purple: #6b5a8a;      /* 紫 */
    --cream: #f6f3ec;       /* 米色底 */
    --ink: #2c3440;         /* 墨色 */
    --ink-2: #5a6472;       /* 次级墨色 */
    --line: #e5dfd3;        /* 分隔线 */
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    line-height: 1.6;
  }
  .container { max-width: 760px; margin: 0 auto; padding: 16px; }

  /* ===== 顶栏 ===== */
  header {
    position: relative;
    text-align: center;
    padding: 34px 16px 26px;
    background: linear-gradient(160deg, var(--blue-dark) 0%, var(--blue) 60%, #2a6395 100%);
    color: #fff;
    margin-bottom: 20px;
    border-radius: 0 0 18px 18px;
    box-shadow: 0 4px 16px rgba(18, 58, 94, .18);
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
    opacity: .85;
  }
  .motto {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-size: 14px;
    letter-spacing: 12px;
    color: rgba(255,255,255,.72);
    margin-bottom: 10px;
  }
  header h1 {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .divider {
    width: 56px; height: 1px;
    background: rgba(255,255,255,.4);
    margin: 12px auto;
  }
  .subtitle { font-size: 13px; opacity: .85; letter-spacing: 1px; }
  .heritage {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.5);
    margin-top: 10px;
  }

  /* ===== 搜索 ===== */
  .search-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-bar input {
    flex: 1; padding: 10px 16px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; outline: none; background: #fff; color: var(--ink);
  }
  .search-bar input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,77,126,.12); }
  .search-bar button {
    padding: 10px 18px; border: none; border-radius: 8px; background: var(--blue);
    color: #fff; font-size: 14px; cursor: pointer; white-space: nowrap; letter-spacing: 1px;
  }
  .search-bar button:hover { background: var(--blue-dark); }

  /* ===== 分类标签 ===== */
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .tab {
    padding: 7px 15px; border-radius: 20px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 13px; white-space: nowrap;
    transition: all .15s; color: var(--ink-2);
  }
  .tab:hover { border-color: var(--blue); color: var(--blue); }
  .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .tab .count { font-size: 11px; opacity: .6; margin-left: 3px; }
  .tab.active .count { opacity: .8; }

  /* ===== 筛选行 ===== */
  .filter-row { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .filter-label { font-size: 12px; color: var(--ink-2); margin-right: 4px; }
  .filters { display: flex; gap: 12px; margin-bottom: 8px; align-items: center; font-size: 13px; }
  .filters label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--ink-2); }
  .filters input[type="checkbox"] { accent-color: var(--blue); }
  .chip {
    padding: 4px 13px; border-radius: 14px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; font-size: 12px; white-space: nowrap;
    transition: all .15s; color: var(--ink-2);
  }
  .chip:hover { border-color: var(--blue); }
  .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .banner {
    background: #fbf7ee; border: 1px solid #e7d9b8; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; color: #6d5a2e;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .banner a { color: var(--red); font-weight: 600; text-decoration: none; white-space: nowrap; }
  .banner a:hover { text-decoration: underline; }

  .stats-bar { font-size: 12px; color: var(--ink-2); margin-bottom: 14px; text-align: center; line-height: 1.6; }

  /* ===== 日期分隔 ===== */
  .date-sep {
    font-size: 13px; font-weight: 600; color: var(--ink);
    padding: 14px 0 8px; margin-top: 2px;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--line);
  }
  .date-sep:hover { color: var(--blue); }
  .fold-arrow { display: inline-block; width: 16px; color: var(--blue); }
  .fold-count { font-weight: normal; color: #9a9384; font-size: 12px; }
  .pending-sep { color: #9a9384; border-bottom: 1px dashed var(--line); margin-bottom: 4px; }
  .pending-sep:hover { color: var(--ink-2); }

  /* ===== 活动卡片 ===== */
  .event-card {
    background: #fff; border-radius: 8px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 2px rgba(28,38,50,.04);
    border: 1px solid var(--line);
    border-left: 3px solid var(--blue);
    transition: box-shadow .15s;
  }
  .event-card:hover { box-shadow: 0 3px 10px rgba(28,38,50,.08); }
  .event-card.lecture { border-left-color: var(--blue); }
  .event-card.event { border-left-color: var(--red); }
  .event-card.volunteer { border-left-color: var(--green); }
  .event-card.movie { border-left-color: var(--purple); }
  .event-card.notice { border-left-color: var(--gold); }
  .event-card.other { border-left-color: #9a9384; }

  .event-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .event-title {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    font-size: 15.5px; font-weight: 600; line-height: 1.45; color: var(--ink);
  }
  .badge-row { display: flex; gap: 5px; flex-wrap: wrap; flex-shrink: 0; justify-content: flex-end; }
  .badge {
    font-size: 11px; padding: 2px 9px; border-radius: 4px; white-space: nowrap;
    letter-spacing: .5px;
  }
  .badge-lecture { background: #eaf1f8; color: var(--blue); }
  .badge-event { background: #f7ecec; color: var(--red); }
  .badge-volunteer { background: #ebf3ed; color: var(--green); }
  .badge-movie { background: #f0edf6; color: var(--purple); }
  .badge-notice { background: #f7f0e0; color: #8a6d26; }
  .badge-other { background: #f0efed; color: #777; }
  .badge-campus { background: #eef1f4; color: var(--ink-2); }
  .badge-ticket-academic { background: #f7ecec; color: var(--red); font-weight: 600; }
  .badge-ticket-theme { background: #f0edf6; color: var(--purple); }
  .badge-volhour { background: #ebf3ed; color: var(--green); }

  .event-meta { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .event-meta span { margin-right: 14px; white-space: nowrap; }
  .event-meta .dot { color: #c5bdad; margin: 0 4px; }
  .event-desc { font-size: 13px; color: #4a5563; margin-bottom: 6px; }

  .event-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11.5px; color: #9a9384; padding-top: 8px; border-top: 1px solid #f1ede4;
  }
  .event-footer a { color: var(--blue); text-decoration: none; }
  .event-footer a:hover { text-decoration: underline; }

  .empty-state { text-align: center; padding: 70px 20px; color: #9a9384; }
  .empty-state .emoji { font-size: 44px; margin-bottom: 14px; }
  .loading { text-align: center; padding: 50px; color: #9a9384; }

  .page-footer {
    text-align: center; padding: 22px 0 30px;
    font-size: 11px; color: #b0a895;
  }
  .page-footer .seal {
    font-family: "Noto Serif SC", "Songti SC", serif;
    color: var(--red); letter-spacing: 2px;
  }

  @media (max-width: 480px) {
    .container { padding: 10px; }
    header { padding: 26px 14px 20px; }
    header h1 { font-size: 22px; }
    .event-title { font-size: 14.5px; }
  }
</style>
</head>
<body>

<header>
  <div class="motto">实事求是</div>
  <h1>天津大学 · 校园活动聚合</h1>
  <div class="divider"></div>
  <div class="subtitle">讲座 · 活动 · 志愿 · 电影 · 通知</div>
  <div class="heritage">北洋 · 一八九五</div>
</header>

<div class="container">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="搜索活动、地点、主办方…" oninput="filterEvents()">
    <button onclick="refreshData()">刷新</button>
  </div>

  <div class="tabs" id="tabContainer">
    <div class="tab active" data-category="all" onclick="switchTab('all', this)">全部</div>
    <div class="tab" data-category="lecture" onclick="switchTab('lecture', this)">讲座</div>
    <div class="tab" data-category="event" onclick="switchTab('event', this)">活动</div>
    <div class="tab" data-category="volunteer" onclick="switchTab('volunteer', this)">志愿</div>
    <div class="tab" data-category="movie" onclick="switchTab('movie', this)">电影</div>
    <div class="tab" data-category="notice" onclick="switchTab('notice', this)">通知</div>
  </div>

  <div class="filter-row">
    <span class="filter-label">校区</span>
    <div class="chip active" data-campus="" onclick="switchCampus('', this)">全部</div>
    <div class="chip" data-campus="卫津路" onclick="switchCampus('卫津路', this)">卫津路</div>
    <div class="chip" data-campus="北洋园" onclick="switchCampus('北洋园', this)">北洋园</div>
    <div class="chip" data-campus="线上" onclick="switchCampus('线上', this)">线上</div>
  </div>

  <div class="filter-row">
    <span class="filter-label">讲座单</span>
    <div class="chip active" data-ticket="" onclick="switchTicket('', this)">全部</div>
    <div class="chip" data-ticket="academic" onclick="switchTicket('academic', this)">人文学术 · 必修</div>
    <div class="chip" data-ticket="theme" onclick="switchTicket('theme', this)">主题教育 · 选修</div>
  </div>

  <div class="filters">
    <label><input type="checkbox" id="upcomingFilter" onchange="filterEvents()"> 只看近期</label>
  </div>

  <div class="banner" id="banner" style="display:none">
    <span id="bannerText">当前收录的公众号可能不完整</span>
    <a href="https://github.com/xwt-netizen/campus-event-hub/issues/new" target="_blank" rel="noopener">补充公众号 →</a>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div id="eventList"></div>
  <div class="page-footer" id="footer"><span class="seal">实事求是</span> · 天津大学</div>
</div>

<script>
const DATA_URL = './events.json';
let allEvents = [];
let currentTab = 'all';
let currentCampus = '';
let currentTicket = '';
const collapsedDates = new Set(['__待定__']);

async function loadData() {
  const list = document.getElementById('eventList');
  list.innerHTML = '<div class="loading">加载中…</div>';

  try {
    const resp = await fetch(DATA_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    allEvents = data.events || [];

    const stats = data.stats || {};
    document.querySelectorAll('.tab').forEach(tab => {
      const cat = tab.dataset.category;
      const cnt = cat === 'all' ? (stats.total || 0) : (stats[cat] || 0);
      const span = tab.querySelector('.count');
      if (!span) {
        const s = document.createElement('span');
        s.className = 'count';
        s.textContent = '(' + cnt + ')';
        tab.appendChild(s);
      } else {
        span.textContent = '(' + cnt + ')';
      }
    });

    const updatedAt = data.updated_at || '未知';
    document.getElementById('footer').innerHTML =
      '<span class="seal">实事求是</span> · 数据更新于 ' + updatedAt + ' · 共 ' + allEvents.length + ' 条';

    filterEvents();
  } catch (e) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">∅</div><p>数据加载失败，请确认 events.json 文件存在</p><p style="font-size:12px;margin-top:8px">' + e.message + '</p></div>';
  }
}

function switchTab(category, el) {
  currentTab = category;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchCampus(campus, el) {
  currentCampus = campus;
  document.querySelectorAll('[data-campus]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function switchTicket(ticket, el) {
  currentTicket = ticket;
  document.querySelectorAll('[data-ticket]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function filterEvents() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const upcomingOnly = document.getElementById('upcomingFilter').checked;
  const list = document.getElementById('eventList');

  let filtered = allEvents.filter(ev => {
    if (currentTab !== 'all' && ev.category !== currentTab) return false;
    if (currentCampus && ev.campus !== currentCampus) return false;
    if (currentTicket && ev.ticket_type !== currentTicket) return false;
    if (upcomingOnly && ev.date && ev.date < getToday()) return false;
    if (search) {
      const haystack = (ev.title + ' ' + ev.location + ' ' + ev.organizer + ' ' + ev.description).toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const da = a.date || '9999-99-99';
    const db = b.date || '9999-99-99';
    if (da !== db) return db.localeCompare(da);
    return (b.start_time || '').localeCompare(a.start_time || '');
  });

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="emoji">∅</div><p>没有匹配的内容</p></div>';
    return;
  }

  const campusCnt = {};
  const ticketCnt = {};
  filtered.forEach(ev => {
    campusCnt[ev.campus || '未知'] = (campusCnt[ev.campus || '未知'] || 0) + 1;
    if (ev.ticket_type) ticketCnt[ev.ticket_type] = (ticketCnt[ev.ticket_type] || 0) + 1;
  });
  let statsParts = ['共 ' + filtered.length + ' 条'];
  const campusParts = Object.entries(campusCnt).map(([k, v]) => (k === '未知' ? '' : k + ' ' + v)).filter(Boolean);
  if (campusParts.length > 0) statsParts.push('· ' + campusParts.join(' · '));
  if (ticketCnt.academic) statsParts.push('· 人文学术 ' + ticketCnt.academic);
  if (ticketCnt.theme) statsParts.push('· 主题教育 ' + ticketCnt.theme);
  document.getElementById('statsBar').textContent = statsParts.join(' ');

  const dated = filtered.filter(ev => ev.date);
  const noDate = filtered.filter(ev => !ev.date);

  let html = '';

  // 待定事件：放最上面，默认折叠
  if (noDate.length > 0) {
    const noDateCollapsed = collapsedDates.has('__待定__');
    html += '<div class="date-sep pending-sep" onclick="toggleDate(\'__待定__\', this)">' +
      '<span class="fold-arrow">' + (noDateCollapsed ? '▸' : '▾') + '</span> ' +
      '待定 · 未标注具体时间 <span class="fold-count">' + noDate.length + ' 条</span></div>';
    html += '<div class="date-group" id="g_pending" style="' + (noDateCollapsed ? 'display:none' : '') + '">';
    for (const ev of noDate) html += renderCard(ev);
    html += '</div>';
  }

  // 有日期事件：按日期分组，每组可折叠
  let lastDate = '';
  for (const ev of dated) {
    const d = ev.date;
    if (d !== lastDate) {
      if (lastDate !== '') html += '</div>';
      const groupId = 'g' + d.replace(/[^0-9]/g, '');
      const isCollapsed = collapsedDates.has(d);
      html += '<div class="date-sep" onclick="toggleDate(\'' + d + '\', this)">' +
        '<span class="fold-arrow">' + (isCollapsed ? '▸' : '▾') + '</span> ' +
        formatDate(d) + ' <span class="fold-count">' + groupCount(dated, d) + ' 条</span></div>';
      html += '<div class="date-group" id="' + groupId + '" style="' + (isCollapsed ? 'display:none' : '') + '">';
      lastDate = d;
    }
    html += renderCard(ev);
  }
  if (lastDate !== '') html += '</div>';

  list.innerHTML = html;
}

function groupCount(events, date) {
  return events.filter(e => e.date === date).length;
}

function toggleDate(date, el) {
  if (collapsedDates.has(date)) collapsedDates.delete(date);
  else collapsedDates.add(date);
  const groupId = (date === '__待定__') ? 'g_pending' : ('g' + date.replace(/[^0-9]/g, ''));
  const group = document.getElementById(groupId);
  if (group) group.style.display = (group.style.display === 'none') ? '' : 'none';
  const arrow = el.querySelector('.fold-arrow');
  if (arrow) arrow.textContent = (collapsedDates.has(date)) ? '▸' : '▾';
}

function renderCard(ev) {
  const catMap = {
    lecture: {label:'讲座', cls:'lecture'},
    event: {label:'活动', cls:'event'},
    volunteer: {label:'志愿', cls:'volunteer'},
    movie: {label:'电影', cls:'movie'},
    notice: {label:'通知', cls:'notice'},
    other: {label:'其他', cls:'other'},
  };
  const c = catMap[ev.category] || catMap.other;

  let badges = '<div class="badge-row">';
  badges += '<span class="badge badge-' + c.cls + '">' + c.label + '</span>';
  if (ev.campus) badges += ' <span class="badge badge-campus">' + escapeHtml(ev.campus) + '</span>';
  if (ev.ticket_type === 'academic') {
    badges += ' <span class="badge badge-ticket-academic">人文学术 · 必修</span>';
  } else if (ev.ticket_type === 'theme') {
    badges += ' <span class="badge badge-ticket-theme">主题教育 · 选修</span>';
  }
  if (ev.volunteer_hours) {
    badges += ' <span class="badge badge-volhour">' + ev.volunteer_hours + ' 小时</span>';
  }
  badges += '</div>';

  const timeStr = [ev.start_time, ev.end_time].filter(Boolean).join('–');
  const meta = [];
  if (ev.date) meta.push('<span>' + escapeHtml(ev.date) + '</span>');
  if (timeStr) meta.push('<span>' + escapeHtml(timeStr) + '</span>');
  if (ev.location) meta.push('<span>' + escapeHtml(ev.location) + '</span>');

  let desc = '';
  if (ev.description) desc = '<div class="event-desc">' + escapeHtml(ev.description) + '</div>';

  let ticketNote = '';
  if (ev.ticket_info) ticketNote = ' · ' + escapeHtml(ev.ticket_info);

  const sources = ev.sources || [];
  let sourceHtml = '';
  if (sources.length > 1) {
    const names = sources.map(s => {
      return s.url && s.url.startsWith('http')
        ? '<a href="' + escapeHtml(s.url) + '" target="_blank" rel="noopener">' + escapeHtml(s.name) + '</a>'
        : escapeHtml(s.name);
    });
    sourceHtml = '来源：' + names.join('、');
  } else {
    sourceHtml = escapeHtml(ev.organizer || ev.source_name) + ticketNote;
  }

  return '<div class="event-card ' + c.cls + '">' +
    '<div class="event-header">' +
      '<div class="event-title">' + escapeHtml(ev.title) + '</div>' +
      badges +
    '</div>' +
    '<div class="event-meta">' + meta.join('<span class="dot">·</span>') + '</div>' +
    desc +
    '<div class="event-footer">' +
      '<span>' + sourceHtml + '</span>' +
      (sources.length <= 1 && ev.source_url && ev.source_url.startsWith('http')
        ? '<a href="' + escapeHtml(ev.source_url) + '" target="_blank" rel="noopener">查看原文 →</a>'
        : '') +
    '</div>' +
  '</div>';
}

function formatDate(d) {
  if (!d) return '待定';
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  try {
    const dt = new Date(d + 'T00:00:00');
    if (isNaN(dt.getTime())) return d;
    const month = dt.getMonth() + 1;
    const day = dt.getDate();
    const wd = weekdays[dt.getDay()];
    const today = new Date();
    const diff = Math.floor((dt - new Date(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    let prefix = '';
    if (diff === 0) prefix = '今天 · ';
    else if (diff === 1) prefix = '明天 · ';
    else if (diff === 2) prefix = '后天 · ';
    else if (diff > 0 && diff <= 7) prefix = '周' + wd + ' · ';
    return prefix + month + '月' + day + '日 周' + wd;
  } catch { return d; }
}

function getToday() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function refreshData() { loadData(); }

loadData();
</script>
</body>
</html>
